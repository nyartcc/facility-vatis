workflow:
  rules:
    - if: $CI_COMMIT_TAG
stages:
  - "generate_archives"
  - "release"
generate_archives:
  stage: generate_archives
  image: alpine:3
  before_script:
    - echo $CI_JOB_ID
    - echo GP_JOB_ID=$CI_JOB_ID >> generate_archives.env
    - apk add --no-cache gzip zip
    - mkdir major-profiles
    - mkdir minor-profiles
  script:
    - echo 'converting and bundling major profiles (no README.pdf)'
    - for profile in source/*.xml; do gzip -cvf $profile > major-profiles/$(basename $profile .xml).gz; done
    - zip -j vATIS_MAJOR_${CI_COMMIT_TAG:1}.zip major-profiles/*
    - echo 'converting and bundling minor profiles (including README.pdf)'
    - for profile in source/minor/*.xml; do gzip -cvf $profile > minor-profiles/$(basename $profile .xml).gz; done
    - cp asset/minor/*.pdf minor-profiles
    - zip -j vATIS_MINOR_${CI_COMMIT_TAG:1}.zip minor-profiles/*
  artifacts:
    untracked: true
    expire_in: 180 days
    paths:
      - vATIS_MAJOR_${CI_COMMIT_TAG:1}.zip
      - vATIS_MINOR_${CI_COMMIT_TAG:1}.zip
    reports:
      dotenv: generate_archives.env
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - echo 'releasing zip bundle...'
  needs:
    - job: generate_archives
      artifacts: true
  release:
    tag_name: '$CI_COMMIT_TAG'
    description: 'created using the release-cli'
    assets:
      links:
        - name: 'All ZNY major vATIS profiles'
          url: 'https://gitlab.com/ny-artcc/facility-files/vatis/-/jobs/${GP_JOB_ID}/artifacts/file/vATIS_MAJOR_${CI_COMMIT_TAG:1}.zip'
        - name: 'All ZNY minor vATIS profiles'
          url: 'https://gitlab.com/ny-artcc/facility-files/vatis/-/jobs/${GP_JOB_ID}/artifacts/file/vATIS_MINOR_${CI_COMMIT_TAG:1}.zip'
