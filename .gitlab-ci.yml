workflow:
  rules:
    - if: $CI_COMMIT_TAG
stages:
  - "generate_archives"
  - "release"
generate_archives:
  stage: generate_archives
  image: alpine:3
  before_script:
    - echo $CI_JOB_ID
    - echo GP_JOB_ID=$CI_JOB_ID >> generate_archives.env
    - apk add --no-cache zip
  script:
    - echo 'bundling N90 profiles...'
    - zip -j vATIS_${CI_COMMIT_BRANCH}_N90_${CI_COMMIT_TAG:1}.zip profiles/*.json
    - echo 'bundling center profiles...'
    - zip -j vATIS_${CI_COMMIT_BRANCH}_ZNY_${CI_COMMIT_TAG:1}.zip profiles/center/*.json
    - echo 'bundling minor profiles...'
    - zip -j vATIS_${CI_COMMIT_BRANCH}_MINOR_${CI_COMMIT_TAG:1}.zip profiles/minor/*.json
  artifacts:
    untracked: true
    expire_in: 180 days
    paths:
      - vATIS_${CI_COMMIT_BRANCH}_N90_${CI_COMMIT_TAG:1}.zip
      - vATIS_${CI_COMMIT_BRANCH}_ZNY_${CI_COMMIT_TAG:1}.zip
      - vATIS_${CI_COMMIT_BRANCH}_MINOR_${CI_COMMIT_TAG:1}.zip
    reports:
      dotenv: generate_archives.env
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - echo 'releasing zip bundles...'
  needs:
    - job: generate_archives
      artifacts: true
  release:
    tag_name: '$CI_COMMIT_TAG'
    description: 'created using the release-cli'
    assets:
      links:
        - name: 'vATIS ${CI_COMMIT_BRANCH}: N90 profiles by area'
          url: 'https://gitlab.com/ny-artcc/facility-files/vatis/-/jobs/${GP_JOB_ID}/artifacts/file/vATIS_${CI_COMMIT_BRANCH}_N90_${CI_COMMIT_TAG:1}.zip'
        - name: 'vATIS ${CI_COMMIT_BRANCH}: Center profiles by area'
          url: 'https://gitlab.com/ny-artcc/facility-files/vatis/-/jobs/${GP_JOB_ID}/artifacts/file/vATIS_${CI_COMMIT_BRANCH}_ZNY_${CI_COMMIT_TAG:1}.zip''
        - name: 'vATIS ${CI_COMMIT_BRANCH}: Minor profiles by airport'
          url: 'https://gitlab.com/ny-artcc/facility-files/vatis/-/jobs/${GP_JOB_ID}/artifacts/file/vATIS_${CI_COMMIT_BRANCH}_MINOR_${CI_COMMIT_TAG:1}.zip'
