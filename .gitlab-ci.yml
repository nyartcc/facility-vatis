workflow:
  rules:
    - if: $CI_COMMIT_TAG
stages:
  - "generate_archives"
  - "release"
generate_archives:
  stage: generate_archives
  image: node:18.2.0-alpine3.14
  before_script:
    - echo $CI_JOB_ID
    - echo GP_JOB_ID=$CI_JOB_ID >> generate_archives.env
    - apk add --no-cache zip
    - mkdir build && mkdir build/minor
  script:
    - node combination_tool.js
    - echo 'bundling N90 and PHL profiles...'
    - zip -j vATIS-v4_N90-PHL_${CI_COMMIT_TAG:1}.zip build/*.json
    - echo 'bundling minor profiles...'
    - zip -j vATIS-v4_MINOR_${CI_COMMIT_TAG:1}.zip build/minor/*.json
  artifacts:
    untracked: true
    expire_in: 180 days
    paths:
      - vATIS-v4_N90-PHL_${CI_COMMIT_TAG:1}.zip
      - vATIS-v4_MINOR_${CI_COMMIT_TAG:1}.zip
    reports:
      dotenv: generate_archives.env
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - echo 'releasing zip bundles...'
  needs:
    - job: generate_archives
      artifacts: true
  release:
    tag_name: '$CI_COMMIT_TAG'
    description: 'created using the release-cli'
    assets:
      links:
        - name: 'vATIS ${CI_COMMIT_BRANCH}: N90 and PHL profile package'
          url: 'https://gitlab.com/ny-artcc/facility-files/vatis/-/jobs/${GP_JOB_ID}/artifacts/file/vATIS-v4_N90-PHL_${CI_COMMIT_TAG:1}.zip'
        - name: 'vATIS ${CI_COMMIT_BRANCH}: Minor profile package'
          url: 'https://gitlab.com/ny-artcc/facility-files/vatis/-/jobs/${GP_JOB_ID}/artifacts/file/vATIS-v4_MINOR_${CI_COMMIT_TAG:1}.zip'
